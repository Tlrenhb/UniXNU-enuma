name: format2 (macOS, release --check then the full release)

# Format-2 path: the device repository is a schema-2 board, the SoC package comes from feeds.toml and
# the kernel patches come from the profile chain (arch -> soc -> os -> device). This workflow exists
# in parallel with kernel.yml (format 1) so the two can be compared until format 2 is green; nothing
# here replaces the format-1 pipeline until it passes.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Device defconfig (schema 2 keeps it in board.toml [kernel])
        required: false
        default: enuma_ufs_defconfig
      storage_audit:
        description: Also qualify the original IOStorageFamily ABI and build the UFS bindings
        type: boolean
        default: false
      full:
        description: Run the whole release (kernel, payload, boot image), not just --check
        type: boolean
        default: false
      kernel_sha:
        description: UniXNU revision (pinned; bump deliberately)
        required: false
        # 2026-11-04 18:39. Deliberately *not* the newest commit: every UniXNU revision from 43e95b2f50
      # (2026-11-04 22:02) onwards points drivers/ArmCpu at 2e11cda72, a commit UniXNU/ArmCpu does not
      # contain ("upload-pack: not our ref"), so `unixnu fetch` dies while initialising submodules. This is
      # the newest revision whose ArmCpu pointer resolves, verified against the API for every commit from
      # here to HEAD. Bump again once upstream fixes the pointer.
      default: "dc98673cad1d7741ca03cea979c577bb81bc58db"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-pipa
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.kernel_sha || 'a885256c53a234d1e9c3cadeaf44299a1ef75fe8' }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Tlrenhb/UniXNU-enuma
          ref: ${{ github.ref_name }}
          path: device

      - name: Check out the same-SoC UEFI port (panic screen font)
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/uefi-pipa
          ref: pipa
          path: uefi-pipa
          fetch-depth: 1

      - name: Report the toolchain
        run: |
          set -euo pipefail
          sw_vers
          if [ -n "${DEVELOPER_DIR:-}" ] && [ -d "$DEVELOPER_DIR" ]; then
            echo "DEVELOPER_DIR from the environment: $DEVELOPER_DIR"
          else
            newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
            echo "picked $newest"
          fi
          xcodebuild -version
          for t in git make clang cmake ninja unifdef python3 xcrun dtc; do printf '%-8s ' "$t"; command -v "$t" || echo MISSING; done

      - name: Install host tools
        run: |
          set -euo pipefail
          # mtools is what the payload step needs (mformat builds the FAT image); without it the step dies with
          # 'mformat not found on PATH'. dtc compiles the board DTS for the ADT generator.
          brew install llvm lld dtc mtools || true
          command -v unifdef >/dev/null || brew install unifdef
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Select the device (schema 2 board, feeds and profiles)
        working-directory: unixnu
        run: ./unixnu defconfig "${{ inputs.defconfig }}"

      - name: Fetch the SoC package, the OS profile sources and the modules
        working-directory: unixnu
        run: ./unixnu fetch

      - name: Show where every module comes from
        working-directory: unixnu
        run: ./unixnu status --json | tee /tmp/status.json

      - name: Assemble the build tree (patches apply arch -> soc -> os -> device)
        working-directory: unixnu
        run: ./unixnu tree

      - name: Release check
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu release --check 2>&1 | tee /tmp/release-check.log

      # The full release is assembled from explicit steps rather than `unixnu release`, for one
      # concrete reason: release's step list is (kernel, package, firmware, payload), and the firmware
      # step needs the Xiaomi vendor drop (xbl.elf from the official fastboot ROM) plus our enumaPkg
      # overlay. Those are proprietary and live in the private pipeline, so the public format-2 job
      # proves the kernel/payload/boot-image path and the firmware keeps its own workflow.
      #
      # The kernel is built twice on purpose: build-platform-power.py compiles the original-PMGR bridge
      # against a kernel that already exists, so a single pass links a no-op sheng_pmgr_run and says so.
      # A no-op bridge panics on hardware with 'AMFI: No PMGR?'. The second pass is incremental.
      - name: Kernel pass 1 (compile records, first kernel)
        if: inputs.full
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu build kernel 2>&1 | tee /tmp/kernel-1.log

      - name: Kernel pass 2 (the PMGR bridge links against the real kernel)
        if: inputs.full
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu build kernel 2>&1 | tee /tmp/kernel-2.log

      - name: Assert the PMGR bridge is not a no-op stub
        if: inputs.full
        working-directory: unixnu
        run: |
          set -euo pipefail
          kernel=$(ls out/enuma/*/*/kernel/kernel.macho | head -1)
          test -n "$kernel" || { echo "::error::no kernel.macho produced"; exit 1; }
          count=$(llvm-objdump -d --disassemble-symbols=_sheng_pmgr_run "$kernel" | grep -c '^fffffff' || true)
          echo "$kernel: $(stat -f%z "$kernel" 2>/dev/null || stat -c%s "$kernel") bytes, sheng_pmgr_run has $count instructions"
          if [ "$count" -lt 50 ]; then
            echo "::error::the PMGR bridge is still a stub ($count instructions)"
            exit 1
          fi
          llvm-nm "$kernel" | grep -c NativeUfs || true
          shasum -a 256 "$kernel"

      # Stage 2 groundwork, and the only route that lets the real ShengUfs block personality link: its
      # eleven IOBlockStorageDevice symbols live in the prelinked collection and are never exported to
      # the kernel link, so every virtual slot has to be resolved either to the driver's own override or
      # to the recorded original address. The audit needs the object record from the kernel build above.
      - name: Emit the prelink candidate the storage audit reads
        if: inputs.storage_audit
        working-directory: unixnu
        run: |
          set -euo pipefail
          tree=$(ls -d out/enuma/*/*/tree | head -1)
          test -n "$tree" || { echo "::error::no assembled tree"; exit 1; }
          "$tree/scripts/make-prelink-candidate.sh" "$tree"

      # The audit does not only read static data: at the end it requires a live observation captured on
      # hardware (build/darwinboot-storage-native-metadata/gdb-stop.json - metaclass memory plus
      # TCR_EL1/SCTLR_EL1/TTBR0/1 from a GDB stop inside the booted prelinked kernel). That is how upstream
      # qualifies the original storage ABI, and it cannot be produced in CI. Without the record the audit
      # stops with a FileNotFoundError, so this step reports the prerequisite instead of pretending the
      # pipeline is broken.
      # Print, into the run log, exactly what has to be read on the tablet: the two metaclass addresses
      # (the IOBlockStorageDevice one is derived from the candidate's plan, because it lives in the
      # prelinked IOStorageFamily kext and is not in the kernel symbol table) and the candidate sha256 the
      # live record must carry.
      - name: Print the addresses the live storage record must contain
        if: inputs.storage_audit
        working-directory: unixnu
        run: |
          set -euo pipefail
          tree=$(ls -d out/enuma/*/*/tree | head -1)
          cd "$tree"
          python3 scripts/emit-storage-abi-addresses.py \
            --candidate build/xnu-prelink/native-apfs-load-positive.macho \
            --plan build/xnu-prelink/native-apfs-load-positive.json | tee /tmp/storage-abi-addresses.txt

      - name: Qualify the original storage ABI
        if: inputs.storage_audit
        working-directory: unixnu
        run: |
          set -euo pipefail
          tree=$(ls -d out/enuma/*/*/tree | head -1)
          test -n "$tree" || { echo "::error::no assembled tree"; exit 1; }
          cd "$tree"
          live=build/darwinboot-storage-native-metadata/gdb-stop.json
          if [ ! -f "$live" ]; then
            echo "::notice title=storage bindings are hardware-gated::$live is missing."
            echo "It is the live ABI observation (metaclass memory + TCR_EL1/SCTLR_EL1/TTBR0/1 from a GDB"
            echo "stop in the booted prelinked kernel) that the audit requires before it will qualify the"
            echo "original IOBlockStorageDevice. Capture it on the tablet, commit it under build/ of the"
            echo "device repository, and re-run with storage_audit=true. UFS stays off until then."
            exit 0
          fi
          python3 scripts/audit-storage-interface.py
          python3 -c "import json;d=json.load(open('build/storage-abi/interface-audit.json'));print('slots',d['method_slots'],'vtable',hex(d['vtable']),'live4k',d['live_native_4k'])"

      - name: Build the UFS original bindings
        if: inputs.storage_audit && hashFiles('unixnu/out/enuma/*/*/tree/build/storage-abi/interface-audit.json') != ''
        working-directory: unixnu
        run: |
          set -euo pipefail
          tree=$(ls -d out/enuma/*/*/tree | head -1)
          cd "$tree"
          python3 scripts/build-enuma-ufs-bindings.py
          ls -l build/sheng-ufs/bindings.json

      - name: Payload (ADT from the board DTS)
        if: inputs.full
        working-directory: unixnu
        run: |
          set -euo pipefail
          # The ADT generator refuses to build a platform identity without a seed:
          # "[payload.adt] unique_chip_id = required" -> pass --unique-chip-id. The value is the same one
          # the format-1 images used, so a payload built here matches them.
          ./unixnu build payload --unique-chip-id ac2fe17bae1d567c 2>&1 | tee /tmp/payload.log

      # The boot image needs the firmware volume, and that comes out of the private pipeline: the
      # enumaPkg overlay plus the Xiaomi vendor drop (xbl.elf) never enter this repository. So the public
      # job stops at the payload - the ADT, the panic-screen patch and the boot entries are all in it -
      # and the boot image is packed where the firmware is (or locally, see scripts/ufs-round.sh).

      - name: Upload the logs and whatever the release produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format2-logs
          path: |
            /tmp/status.json
            /tmp/release-check.log
            /tmp/release.log
            unixnu/out/enuma/**/logs/**
            # The products, so a boot image can be packed locally against the firmware volume from the
            # private pipeline (the only place that has the vendor drop). Without these the run proves the
            # pipeline but leaves nothing to boot.
            unixnu/out/enuma/*/*/kernel/kernel.macho
            unixnu/out/enuma/*/*/payload/payload.img
            unixnu/out/enuma/*/*/tree/build/storage-abi/interface-audit.json
            unixnu/out/enuma/*/*/tree/build/sheng-ufs/bindings.json
          if-no-files-found: warn