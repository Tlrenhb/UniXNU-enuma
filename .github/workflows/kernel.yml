name: kernel (macOS, XNU + prelink)

# The kernel step is the one part of UniXNU that needs macOS: `unixnu build kernel` drives
# scripts/build-xnu-4k-baseline.sh, which builds against the Xcode iphoneos SDK
# (docs/zh/building.md:31 — "内核、userdata 和 Data 种子步骤调用 Xcode、hdiutil 和 diskutil。
#  fork 后可以在 GitHub 的 macOS runner 上运行这些步骤，不需要本地 Mac").
#
# Why this lives in the public device repository and not in the private one: the macOS runner
# multiplies consumption by 10, and nothing this job touches is private. It needs the UniXNU
# main tree, this device repository and Apple's public IPSW — no vendor drop, no firmware.
# The kernel it produces is handed to the private firmware build as a release asset.
#
# The revision is pinned (board.toml says the same thing: "不要用最新 upstream main"). Upstream
# renamed the AES helper to build-software-aes-bindings.py and moved its objects to
# build/software-aes in the days before this workflow existed; unpinned, a rename lands between
# a green build and the next red one with nothing in this repository having changed.
on:
  workflow_dispatch:
    inputs:
      storage_audit:
        description: Also qualify the original IOStorageFamily ABI and build the UFS bindings
        required: false
        default: false
      defconfig:
        description: Device defconfig (stage 1 = enuma_defconfig, stage 2 = enuma_ufs_defconfig)
        required: false
        default: enuma_defconfig
      kernel_sha:
        description: UniXNU revision to build (pinned; bump deliberately)
        required: false
        default: "a885256c53a234d1e9c3cadeaf44299a1ef75fe8"   # 2026-11-01 00:37
      keep_ipsw:
        description: Keep the extracted IPSW members (debugging only, they are proprietary)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      # The panic screen's Font.h comes from the Mu-Silicium checkout (no UART on this tablet,
      # so the panic screen is the only kernel output channel).
      UNIXNU_UEFI: ${{ github.workspace }}/uefi-pipa
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.kernel_sha || 'main' }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Tlrenhb/UniXNU-enuma
          ref: main
          path: device

      - name: Check out the same-SoC UEFI port (panic screen font)
        uses: actions/checkout@v4
        with:
          repository: xVanTuring/uefi-pipa
          ref: pipa
          path: uefi-pipa
          fetch-depth: 1

      - name: Report the toolchain
        run: |
          set -euo pipefail
          sw_vers
          echo "--- Xcodes"
          ls -1 /Applications | grep -i '^Xcode' || true
          # The image's default Xcode is used unless it is missing; never pin a version the image
          # may not carry (the previous draft pinned Xcode_26.6 and would have died here).
          if [ -n "${DEVELOPER_DIR:-}" ] && [ -d "$DEVELOPER_DIR" ]; then
            echo "DEVELOPER_DIR from the environment: $DEVELOPER_DIR"
          else
            newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
            echo "picked $newest"
          fi
          xcodebuild -version
          echo "--- tools"
          for t in git make clang cmake ninja unifdef python3 xcrun; do printf '%-8s ' "$t"; command -v "$t" || echo MISSING; done

      - name: Install host tools
        run: |
          set -euo pipefail
          brew install llvm lld
          command -v unifdef >/dev/null || brew install unifdef
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Confirm the panic screen font is reachable
        run: |
          set -euo pipefail
          f="$UNIXNU_UEFI/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h"
          test -f "$f" && echo "Font.h: $f"
          ls -la "$f"

      - name: Select the device
        working-directory: unixnu
        run: ./unixnu defconfig "${{ inputs.defconfig }}"

      - name: Fetch sources
        working-directory: unixnu
        run: ./unixnu fetch

      - name: Assemble the build tree
        working-directory: unixnu
        run: ./unixnu tree

      - name: Fetch the IPSW members (KernelCache for prelink, DeviceTree for the boot image)
        working-directory: unixnu
        run: ./unixnu ipsw fetch KernelCache DeviceTree StaticTrustCache Cryptex1,SystemTrustCache

      - name: Build the kernel
        working-directory: unixnu
        run: ./unixnu build kernel

      # build-platform-power.py compiles the board's original-PMGR bridge against a kernel that
      # already exists: on a fresh tree it archives a no-op sheng_pmgr_run and says so in
      # logs/archive-09-build-platform-power.log ("no reference kernel yet ... build the kernel
      # again to link the bridge"). A no-op bridge means AMFI panics on hardware with
      # 'AMFI: No PMGR?' @ConfigurationSettings.cpp:235, so the second pass is not optional.
      # The reference IOStorageFamily source is already in the tree: feeds.toml pins it and
      # `unixnu fetch` put it at out/enuma/tree/refer/IOStorageFamily (revision e45fbe30), which is
      # exactly what audit-storage-interface.py asserts.
      #
      # The original-bindings route upstream uses for storage: compile the real IOStorageFamily
      # class, qualify its ABI against the prelinked kernel, then resolve every virtual slot of the
      # concrete UFS block class either to its own override or to the recorded original address.
      # Without this the block personality cannot link at all, which is where this port stopped.
      - name: Qualify the original storage ABI
        if: inputs.storage_audit == 'true'
        working-directory: unixnu/out/enuma/tree
        run: |
          set -euo pipefail
          python3 scripts/audit-storage-interface.py
          python3 -c "import json;d=json.load(open('build/storage-abi/interface-audit.json'));print('slots',d['method_slots'],'vtable',d['vtable'],'live4k',d['live_native_4k'])"

      - name: Build the UFS original bindings
        if: inputs.storage_audit == 'true'
        working-directory: unixnu/out/enuma/tree
        run: |
          set -euo pipefail
          python3 scripts/build-enuma-ufs-bindings.py
          ls -l build/sheng-ufs/bindings.json build/sheng-ufs/libNativeUfsBlock.a

      - name: Upload the bindings
        if: inputs.storage_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: enuma-ufs-bindings
          path: |
            unixnu/out/enuma/tree/build/storage-abi/interface-audit.json
            unixnu/out/enuma/tree/build/sheng-ufs/bindings.json
            unixnu/out/enuma/tree/build/sheng-ufs/libNativeUfsBlock.a
          if-no-files-found: warn

      - name: Build the kernel again so the PMGR bridge is real
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu build kernel
          grep -q "no reference kernel yet" out/enuma/logs/archive-09-build-platform-power.log \
            && { echo "::error::the PMGR bridge is still a no-op stub"; exit 1; } \
            || echo "PMGR bridge: real implementation linked"

      - name: Prelink the kernel against the original kernelcache
        working-directory: unixnu
        run: ./unixnu build prelink

      - name: Report the artefacts
        if: always()
        working-directory: unixnu
        run: |
          set -uo pipefail
          echo "--- out/enuma/kernel"
          ls -la out/enuma/kernel 2>/dev/null || true
          for f in out/enuma/kernel/kernel.macho out/enuma/kernel/kernel.json; do
            [ -f "$f" ] && { stat -c '%n %s bytes' "$f" 2>/dev/null || stat -f '%N %z bytes' "$f"; shasum -a 256 "$f"; }
          done
          echo "--- logs"
          ls -la out/enuma/logs 2>/dev/null | tail -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enuma-kernel-${{ github.run_attempt }}
          path: |
            unixnu/out/enuma/kernel/**
            unixnu/out/enuma/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## enuma kernel (macOS)"
            echo
            echo "kernel.macho = source-built 4K XNU, prelinked against the iPad7,1 17.7.11 kernelcache."
            echo "It is an input of the private firmware build, never a flashed image on its own."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove proprietary inputs
        if: always() && !inputs.keep_ipsw
        run: rm -rf unixnu/out/ipsw unixnu/out/feeds device/.cache/firmware unixnu/out/*/tree/.cache/firmware