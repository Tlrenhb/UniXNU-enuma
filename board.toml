# enuma（小米平板 5 Pro 5G，SM8250-AC / 骁龙 870）—— **UniXNU 格式 2**
#
# 这份文件是格式 2 迁移的产物（分支 `format2`）。格式 1 的原件保留在
# `legacy/board.toml.format1`，里面有逐条 `文件:行` 的出处与历史；这里只保留格式 2 需要的字段。
#
# 格式 2 与格式 1 的差别（决定了我们为什么要迁）：
#   - 内核补丁按 arch → soc → os → device 的顺序应用，**设备级补丁**终于有地方放了
#     （格式 1 里 `patches.plan()` 直接返回空，补丁无处可放）；
#   - SoC 级材料（CPU 亲和性、GICv3、19.2 MHz 架构定时器）由 SoC 仓提供，不再手抄；
#   - 组件用 `component:<ID>` 引用，UFS 直接用上游的 ShengUfs，不必再 vendor 一份；
#   - ADT 由 board.toml 的 `[adt.*]` 声明式生成，我们那个 make-enuma-adt.py 的特例（chip_id、
#     cpu_regs、psci、iPAD 身份）逐项搬进这里。
schema_version = 2

[board]
name = "enuma"
soc = "SM8250-AC"                    # astide: enuma 全部落在 sm8250 家族；LineageOS 板级 TARGET_BOARD_PLATFORM := kona
soc_source = "sm8250"                # feeds.toml 钉的 FFT-infra/UniXNU-sm8250-common
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Pad 5 Pro 5G"
kit = "enuma"

[userdata]
first_lba = 2686976                  # 0x290000：2026-10-23 实测 sysfs start 21495808(512B)/8
last_lba = 61880314                  # 0x3b037fa：实测 size 473546712(512B)/8
lba_bytes = 4096                     # 实测 blockdev --getss

[kernel]
# 迁移期先跑阶段 1 的 defconfig：UFS 那一档要等块设备人格的 IOStorageFamily 绑定
# （storage ABI 审计 + original-bindings）接进格式 2 的链条，否则 component:ShengUfs 会把
# 十一个基类符号的链接问题原样带进来（格式 1 里就是这么卡住的）。
# 阶段 2 重新打开时改回 enuma_ufs_defconfig 即可。
defconfig = "enuma_ufs_defconfig"
# 顺序即应用顺序：arch → soc → os → device。
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
# 顺序不是照抄上游：设备系列必须排在 os 之前。os 的 zzz-boot-progress.patch 会在 bsd_init() 里给
# sheng_pmgr_run() 调用点加插桩，而那个调用点由设备系列的 sheng-platform-power.patch 引入；
# 先设备后 os，两条都能干净应用（本地已逐条 git apply --check 验证）。
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series", "os:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-native-aes-bindings.py",
  "build-libpthread-kernel.py",
  # CONFIG_XNU_SOURCE_MOCKFS 来自 arch 的 common.config，打开后 vfs_conf.o 会引用 mockfs 的三个符号；
  # 缺这个构建器时 build-xnu-4k-baseline.sh 在 `test -f "$MOCKFS_ARCHIVE"` 处直接退出
  # （2026-11-05 实测：kernel.log 只有这一行）。格式 2 的 [kernel] archives 取代了 profile 里的归档列表，
  # 所以这一条必须显式列出。
  "build-mockfs-fixture.py",
  "build-link-stubs.py",
  "build-platform-power.py",
  # 存储链路（2026-11-13 接入）。ShengUfs 一编译就要 IOStorageFamily 的十一个基类符号，而 IOKit 是
  # prelinked、一个都不导出，所以 archive 之后必须再跑 build-storage-bindings.py 把绝对地址绑上去。
  # 地址取 scripts/data/native-storage-original-bindings.S（静态推导）；这份文件对 enuma 有效，因为它是
  # 同一 OS profile（ipados-17.7.11-21H461）的 original link 地址，与本板额外组件无关 —— 已用本仓库 CI
  # 独立推导的 vtable 0xfffffff005cb44c0 / getter 0xfffffff00496edc4 / meta 0xfffffff006add1d0 三个值逐一对上。
  "component:ShengUfs",
  # --subset: 录制文件带的 __ZN7IOMedia9metaClassE 这一版 ShengUfs 并不引用（第一次构建时
  # build-storage-bindings.py 直接以此报错退出，2026-11-13 run 43443228954 的 archive-13 日志）。
  "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs --subset",
  "component:RamBlock",
  "build-storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block --subset",
]

[firmware]
config = "enuma"
dsc = "Platforms/Xiaomi/enumaPkg/enuma.dsc"
fd = "Build/enumaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/fetch-enuma-dts.py", "scripts/check-enuma.py"]
submodules = [
  # 官方 Mu-Silicium 子模块；"Binaries" 故意不列：enuma 的 vendor drop 由工作流从官方 fastboot ROM
  # 的 xbl.elf 放到 Binaries/enuma/，不能让 submodule init 去拉。
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicium-ACPI",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# 未签名的 EFI 程序会被 DxeImageVerificationLib 拒绝（首轮实测 Access Denied），故降到 0。
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "enuma-research"

[device_tree]
source = "device:dts/enuma.dts"
include_dirs = ["soc:dts"]

[bootimg]
dtb = "build/enuma/enuma.dtb"

[components]
# SoftwareAES 必须在 include 里：enuma_defconfig 打开 CONFIG_XNU_NATIVE_AES，而 [kernel] archives 引用
# `component:SoftwareAES` —— 不在 include 时 kernel 步骤直接报 "component SoftwareAES is not selected"。
# QcomXnuUsbDebug（2026-11-14 纳入）：fork 的 release 检查会解析组件目录里 os_abi 匹配的驱动，
# 缺它时直接报 "component source unavailable: QcomXnuUsbDebug; run unixnu fetch"。而且它正是我们
# 一直缺的东西 —— CDC-ACM 串口控制台（DWC3/SM8250），有了它就不必再用"复位延时编码"读内核了。
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "QcomXnuUsbDebug", "XnuPrelink", "DarwinBoot"]

[payload]
volume = "ENUMAESP"
size_mib = 64
loader = "firmware"
# -1 = 停在菜单等按键。默认的 3 秒自动选第一项，在真机上意味着"插上就自己跑"，
# 取证时来不及摆相机，也会让一次误操作立刻变成一次启动。
timeout = -1
title = "enuma：4 KiB XNU 到 panic 屏 / UFS 只读取证"
dram_size = "0x200000000"            # 最高 System RAM 银行止于 0x280000000，减 0x80000000 DRAM 基址
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "sheng-pmgr=2",
  # native-ufs-probe 不在这里：那个参数是格式 1 我们自己探针的名字，而格式 2 用的是上游 ShengUfs 驱动，
  # 它的 mode 9 会把 START STOP UNIT 发给 LUN 0xD0（改变设备电源态）再读 GPT 并 panic。enuma_defconfig
  # 现在把 UFS 关着，参数不会生效，但留着就是一颗哑弹 —— UFS 一旦打开它会真的动手。要做 UFS 实验时
  # 单独发一张镜像、显式指定模式。
  # SM8250 把 UFS 主机接在 stream 0x0e0 / 0x4e0 上；NativeUfs 的默认 0x60 是 sheng（SM8550）的板子。
  # 少了这条，SMMU 会把 UFS 的 DMA 拒绝掉（alioth 同 SoC 的实测结论）。
  "native-ufs-stream=0xe0",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # cpus=1 已去掉：device:patches/xnu/series 的 native-smp-secondary.patch 把 MAX_CPUS 提到 8，
  # 并让 BCM2837 机器配置从 AFF1 取核号（kona 的编号方式）。若 8 核仍挂，把它加回来做对照。
]

[payload.adt]
chip_id = "356"                      # 0x164，SM8250
owned_memory_size = "0x10000000"
packed_data_ramdisk = true
ipad_identity = true
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # 同一 IPSW 的 OS 卷 UUID（pipa/umi 同值）
unique_chip_id = "required"          # 平台种子不存仓库

[adt]

[adt.product]

[adt.product.string]
model = "J120AP"                     # iPad7,1 = j120ap，与 [ipsw].product 一致
artwork-display-gamut = "sRGB"

[adt.defaults]

[adt.defaults.u32]
sleep-disabled = 1
# 没有 Apple PMGR / SEP：报虚拟平台，AMFI 才不会等 ApplePMGRNub。
vmm-present = 1

[adt.chosen.u32]
# SM8250 没有 CTRR，内核文本对硬件仍可写（iBoot 在 Apple SoC 上写这个）。
kernel-ctrr-to-be-enabled = 0

[adt.buttons]

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
# 2026-11-13: 与 [kernel] defconfig 必须同步。这一项决定 package（含内核编译）用哪份配置；
# 只改 [kernel] 那一处时内核仍然是阶段 1 的产物 —— 实测：archive-13 的绑定 PASS、ShengUfs 组件
# 也 PASS，但 kernel.macho 里连一个 NativeUfs 符号都没有（run 43448091244）。
"ipados-17.7.11-21H461" = "enuma_ufs_defconfig"