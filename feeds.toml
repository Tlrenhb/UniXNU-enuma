# SoC profile for enuma (SM8250-AC / Snapdragon 870).
#
# There are five SM8250 SoC packages published for UniXNU and they differ a lot; this one is pinned
# because it is the only one that carries what this port actually needs:
#   - dts/sm8250.dtsi with the eight kona CPU nodes (A55 0x0..0x300, A77 0x400..0x700), GICv3 at
#     0x17a00000, the UFS controller (ufshc@1d84000, "qcom,sm8250-ufshc","qcom,ufshc") and the
#     Adreno SMMU (mmu-500 @3da0000);
#   - patches/xnu/native-smp-secondary.patch and native-smp-type-clusters.patch - the two halves of
#     the eight-core fix (MAX_CPUS 4->8, core number from MPIDR Affinity1 on the BCM2837 machine
#     configuration, two typed clusters with the Edge scheduler);
#   - kits/Sm8250Platform with the A650 GMU work for later stages.
# The other four were compared on 2026-11-04: ht94911 is the scoped CPU-only package, Upcry still has
# REQUIRED_MAINLINE_PIN placeholders, zhangp996 has a larger dtsi but no patches, stevedang67889 ships
# Linux CONFIG_ symbols (CONFIG_ARCH_QCOM ...) that mean nothing to XNU.
#
# What stays here: RAM and reserved regions, which CPUs are enabled, the peripheral wiring (UFS,
# GCC, SMMU, PMIC, TLMM, display) and every board policy decision.
[[source]]
